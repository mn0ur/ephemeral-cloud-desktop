name: Desktop - REAPER

# Per-user desktops have no fixed session length any more - a guest who
# closes the tab and never clicks Destroy would otherwise bill $0.104/hr
# indefinitely. This is what enforces "destroy after 4 hours of not being
# USED" (not "4 hours after launch regardless of use") in practice.
#
# There is no fixed list of usernames to loop over - discovery is by AWS
# tag (Role=guest-desktop), not a hardcoded set. The owner's own desktop
# carries no such tag and is never touched by this workflow.
#
# ---------------------------------------------------------------------------
# THE SCHEDULE IS DELIBERATELY DISABLED. Do not re-enable it without first
# verifying the activity tracker on a real desktop.
#
# This reaper trusts /last-activity, a file kept current by an
# activity-tracker service tailing Caddy's access log. That service has
# never been verified against real traffic, and its two failure modes are
# NOT equally safe:
#
#   pattern doesn't match  -> monitoring counts as activity -> never
#                             destroys anything. Harmless.
#   tracker service dead   -> the file is written ONCE at boot, so it keeps
#                             returning a valid-looking number forever ->
#                             this workflow destroys a desktop someone is
#                             actively working in, 4h after it booted.
#
# The second one loses a user's session mid-use. Running an unverified
# auto-destroyer on a 15-minute cron is not worth that.
#
# Consequence, accepted knowingly: nothing stops a forgotten desktop
# billing at $0.104/hr. Visible in the control panel (running time and
# session cost) and manually destroyable, which is adequate for a single
# operator - and NOT adequate once real guests use this.
#
# When that gap needs closing, prefer a MAX-SESSION-AGE reaper over this
# one: LaunchTime comes from the EC2 API, so it depends on nothing running
# inside the instance and has no unverifiable moving parts.
# ---------------------------------------------------------------------------
on:
  workflow_dispatch: {} # manual only - see above before adding a schedule

permissions:
  contents: read

env:
  IDLE_LIMIT_S: 14400 # 4 hours

jobs:
  reap:
    name: destroy anything idle past the limit
    runs-on: ubuntu-latest

    # Region and zone in ONE place. They used to be repeated inline in every
    # aws call and every AWS_DEFAULT_REGION export, which is how a region move
    # turns into a hunt. ap-south-1c specifically: spot there is $0.0529/hr
    # against $0.0651 in ap-south-1a - the zone a hardcoded "a" would have
    # picked - and 47% under eu-central-1.
    env:
      AWS_REGION: ap-south-1
      AWS_AZ: ap-south-1c
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7

      - name: Configure AWS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::AWS secrets are not set."
            exit 1
          fi
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=$AWS_REGION" >> "$GITHUB_ENV"

      - name: Discover every live guest desktop, destroy anything idle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HUB_CALLBACK_SECRET: ${{ secrets.HUB_CALLBACK_SECRET }}
        run: |
          set -uo pipefail
          NOW=$(date -u +%s)

          USERNAMES=$(aws ec2 describe-instances --region "$AWS_REGION" \
            --filters "Name=tag:Role,Values=guest-desktop" "Name=instance-state-name,Values=running,pending" \
            --query 'Reservations[].Instances[].Tags[?Key==`Owner`].Value | [0]' \
            --output text)

          if [ -z "$USERNAMES" ]; then
            echo "no guest desktops currently running"
            exit 0
          fi

          for USERNAME in $USERNAMES; do
            URL="https://$USERNAME.desktop.mnour.dev"
            LAST=$(curl -fsS --max-time 8 "$URL/last-activity" 2>/dev/null || echo "")

            if ! [[ "$LAST" =~ ^[0-9]+$ ]]; then
              # Can't reach it, or it hasn't finished booting yet - do not
              # destroy on the strength of a failed HTTP request. A network
              # blip must never look the same as genuine inactivity.
              echo "$USERNAME: /last-activity unreachable or malformed ('$LAST') - leaving it, not treating as idle"
              continue
            fi

            IDLE_S=$((NOW - LAST))
            if [ "$IDLE_S" -ge "$IDLE_LIMIT_S" ]; then
              echo "$USERNAME: idle ${IDLE_S}s >= ${IDLE_LIMIT_S}s limit - destroying"
              terraform -chdir=terraform init -input=false -reconfigure \
                -backend-config="key=desktop/user-$USERNAME/terraform.tfstate"
              TF_VAR_username="$USERNAME" terraform -chdir=terraform destroy -auto-approve -input=false

              if [ -n "${HUB_CALLBACK_SECRET:-}" ]; then
                curl -fsS -X POST "https://desktop.mnour.dev/api/session-ended" \
                  -H "Authorization: Bearer $HUB_CALLBACK_SECRET" \
                  -H "Content-Type: application/json" \
                  -d "{\"username\":\"$USERNAME\",\"reason\":\"idle\"}" \
                  || echo "::warning::callback failed for $USERNAME - destroy already succeeded"
              fi
            else
              echo "$USERNAME: idle ${IDLE_S}s, under the ${IDLE_LIMIT_S}s limit - leaving it"
            fi
          done
