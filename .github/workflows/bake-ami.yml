name: Bake Desktop AMI

# Manual only - this is not something that should run on every push. Run it
# when the desktop image (linuxserver/webtop) or base OS packages change and
# a fresh boot needs to pick that up.
on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region to bake into. AMIs are region-specific, so a region move needs its own bake - this input is what lets the new region be prepared while the old one keeps serving."
        type: string
        default: "me-central-1"
      gpu:
        description: "Bake the GPU variant: NVIDIA driver + container toolkit + DRM kernel args, built ON a g4dn so the driver is verified against a real T4. Produces Variant=gpu; leave false for the CPU AMI."
        type: boolean
        default: false
      os:
        description: "Which desktop to bake. linux (default) is the webtop/Selkies image; windows bakes Windows Server 2025 + Amazon DCV from scripts/bake-windows.ps1 and produces Variant=windows. gpu is ignored for windows in this pass."
        type: choice
        options: [linux, windows]
        default: linux

permissions:
  contents: read

env:
  AWS_REGION: ${{ inputs.region }}
  # IMAGE is deliberately NOT hardcoded here. It was, and it drifted: this
  # workflow baked ubuntu-kde while terraform/variables.tf's var.image
  # actually launches debian-kde. The bake "succeeded", the AMI looked
  # correct, and every boot still pulled its 2GB image from the registry -
  # while ALSO paying extra snapshot-restore latency for 2GB of layers
  # nothing would ever use. Net effect was a SLOWER boot than no AMI at all
  # (383s vs ~325s measured), and nothing detected it because both halves
  # were independently self-consistent.
  #
  # The value is now read out of terraform/variables.tf at run time, so
  # there is exactly one source of truth and this cannot drift again.

jobs:
  bake:
    name: launch, pull image, snapshot, terminate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the desktop image from terraform, the single source of truth
        if: inputs.os != 'windows'
        run: |
          set -euo pipefail
          IMAGE=$(python3 - <<'PY'
          import re, sys
          src = open('terraform/variables.tf').read()
          block = re.search(r'variable\s+"image"\s*\{(.*?)\n\}', src, re.S)
          if not block:
              sys.exit('could not find variable "image" in terraform/variables.tf')
          default = re.search(r'default\s*=\s*"([^"]+)"', block.group(1))
          if not default:
              sys.exit('variable "image" has no literal default to bake')
          print(default.group(1))
          PY
          )
          echo "baking the image terraform actually launches: $IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Configure AWS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=$AWS_REGION" >> "$GITHUB_ENV"

      - name: Launch a throwaway instance in the default VPC (linux)
        if: inputs.os != 'windows'
        run: |
          set -euo pipefail
          BASE_AMI=$(aws ec2 describe-images --owners 099720109477 \
            --filters "Name=name,Values=ubuntu/images/hvm-ssd-gp3/ubuntu-noble-24.04-amd64-server-*" \
                       "Name=virtualization-type,Values=hvm" \
            --query 'sort_by(Images,&CreationDate)[-1].ImageId' --output text)
          echo "base AMI: $BASE_AMI"

          SUBNET=$(aws ec2 describe-subnets \
            --filters "Name=default-for-az,Values=true" \
            --query 'Subnets[0].SubnetId' --output text)

          # Bake everything a boot would otherwise fetch from the network. Keep
          # this list a SUPERSET of what user-data.sh.tpl installs: an extra
          # package here only costs image size, whereas a missing one just
          # sends that boot back to the network for it.
          #
          # The Caddy binary is the important one. user-data needs Caddy WITH
          # the caddy-dns/cloudflare module, and the only source for that is a
          # server-side BUILD request to caddyserver.com - paid on every boot,
          # and the largest single term left after the image was baked. It is
          # identical every time, so it belongs here. user-data verifies the
          # module is really present (caddy list-modules) before trusting it,
          # so a bad or stale binary falls back to downloading rather than
          # failing later on a DNS challenge.
          cat > bake-user-data.sh <<'EOF'
          #!/bin/bash
          set -euo pipefail
          apt-get update -y
          apt-get install -y ca-certificates curl gnupg jq debian-keyring debian-archive-keyring apt-transport-https
          apt-get install -y --no-install-recommends docker.io
          systemctl enable --now docker
          docker pull "$IMAGE_PLACEHOLDER"

          case "$(uname -m)" in
            aarch64) CADDY_ARCH="arm64" ;;
            x86_64)  CADDY_ARCH="amd64" ;;
            *) echo "FATAL: unrecognised architecture $(uname -m)"; exit 1 ;;
          esac
          curl -fsSL "https://caddyserver.com/api/download?os=linux&arch=$CADDY_ARCH&p=github.com/caddy-dns/cloudflare" \
            -o /usr/bin/caddy
          chmod 755 /usr/bin/caddy
          # Fail the bake rather than ship an AMI whose Caddy is unusable -
          # a boot would silently fall back to downloading and the whole
          # point of baking it would be lost with no signal.
          /usr/bin/caddy version
          /usr/bin/caddy list-modules | grep -q '^dns.providers.cloudflare$'

          if [ "$GPU_PLACEHOLDER" = "true" ]; then
            # Driver from NVIDIA's own CUDA repo, not Ubuntu's: the docs require
            # 580 or newer for this image's GPU path and the distro archive lags
            # well behind that. cuda-drivers is the metapackage that tracks the
            # current release.
            curl -fsSL -o /tmp/cuda-keyring.deb \
              https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
            dpkg -i /tmp/cuda-keyring.deb
            apt-get update -y
            DEBIAN_FRONTEND=noninteractive apt-get install -y cuda-drivers

            # nvidia-container-toolkit is what lets `docker run --gpus all`
            # work at all; without the runtime configured, that flag errors.
            curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey \
              | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
            curl -fsSL https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list \
              | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' \
              > /etc/apt/sources.list.d/nvidia-container-toolkit.list
            apt-get update -y
            apt-get install -y nvidia-container-toolkit
            nvidia-ctk runtime configure --runtime=docker
            systemctl restart docker

            # DRM modeset must be on the kernel command line for /dev/dri to
            # appear, which the Zero Copy encode path needs. It only takes
            # effect on the NEXT boot - which is every instance launched from
            # this AMI, so baking the grub change is exactly right even though
            # this bake instance itself never sees it applied.
            sed -i 's/GRUB_CMDLINE_LINUX_DEFAULT="\(.*\)"/GRUB_CMDLINE_LINUX_DEFAULT="\1 nvidia-drm.modeset=1 nvidia_drm.fbdev=1"/' /etc/default/grub
            update-grub

            # Verify against the real T4 this is baking on. modprobe because a
            # freshly installed driver is not loaded yet; if nvidia-smi still
            # fails the driver is genuinely broken and shipping the AMI would
            # only move the failure to every future boot.
            modprobe nvidia || true
            nvidia-smi
          fi

          touch /home/ubuntu/bake-complete
          EOF
          sed -i "s|\$IMAGE_PLACEHOLDER|$IMAGE|" bake-user-data.sh
          sed -i "s|\$GPU_PLACEHOLDER|${{ inputs.gpu }}|" bake-user-data.sh

          # The GPU variant bakes ON a g4dn so the driver is verified against a
          # real T4 rather than merely installed. The CUDA driver stack is also
          # several GB, so the default 8GB root is not enough - 40GB leaves room
          # for it plus the desktop image.
          if [ "${{ inputs.gpu }}" = "true" ]; then
            BAKE_TYPE=g4dn.xlarge
            ROOT_GB=40
          else
            BAKE_TYPE=t3.medium
            ROOT_GB=16
          fi
          echo "baking on $BAKE_TYPE with a ${ROOT_GB}GB root"

          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id "$BASE_AMI" --instance-type "$BAKE_TYPE" \
            --subnet-id "$SUBNET" --associate-public-ip-address \
            --block-device-mappings "DeviceName=/dev/sda1,Ebs={VolumeSize=$ROOT_GB,VolumeType=gp3,DeleteOnTermination=true}" \
            --user-data file://bake-user-data.sh \
            --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=ami-bake-temp}]' \
            --query 'Instances[0].InstanceId' --output text)
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"

      - name: Launch a throwaway instance in the default VPC (windows)
        if: inputs.os == 'windows'
        run: |
          set -euo pipefail
          # Latest AWS-published Server 2025 base, by name: no AMI IDs to
          # hunt down on a region move.
          BASE_AMI=$(aws ec2 describe-images --owners amazon \
            --filters "Name=name,Values=Windows_Server-2025-English-Full-Base-*" "Name=state,Values=available" \
            --query 'sort_by(Images,&CreationDate)[-1].ImageId' --output text)
          echo "base AMI: $BASE_AMI"
          SUBNET=$(aws ec2 describe-subnets \
            --filters "Name=default-for-az,Values=true" \
            --query 'Subnets[0].SubnetId' --output text)

          # On-demand, not spot: a bake that hangs on capacity helps nobody.
          # m6i.large is the size the desktop will run on; ~$0.19/hr Windows
          # on-demand, and a bake is ~30 minutes.
          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id "$BASE_AMI" --instance-type m6i.large \
            --subnet-id "$SUBNET" --associate-public-ip-address \
            --block-device-mappings "DeviceName=/dev/sda1,Ebs={VolumeSize=50,VolumeType=gp3,DeleteOnTermination=true}" \
            --user-data file://scripts/bake-windows.ps1 \
            --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=ami-bake-temp-windows}]' \
            --query 'Instances[0].InstanceId' --output text)
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"

      - name: Wait for the image pull to finish
        if: inputs.os != 'windows'
        run: |
          # No SSM/instance-role on this throwaway box - poll console output
          # for the completion marker instead of anything requiring inbound
          # access. Docker pulling ~2GB comfortably finishes well inside 10
          # minutes, but the GPU variant also installs the multi-GB CUDA driver
          # stack, so the ceiling here is 20 minutes. If it is still not done,
          # something is actually wrong and should fail loud rather than
          # snapshot a half-provisioned image.
          FOUND=0
          for i in $(seq 1 60); do
            OUT=$(aws ec2 get-console-output --instance-id "$INSTANCE_ID" --output text --query Output || true)
            if echo "$OUT" | grep -q "bake-complete\|cloud-init.*finished"; then
              FOUND=1
              sleep 30 # give dockerd a moment to flush the pulled layers to disk
              break
            fi
            sleep 20
          done
          if [ "$FOUND" -ne 1 ]; then
            echo "Timed out waiting for the image pull to finish - refusing to snapshot a half-pulled image" >&2
            exit 1
          fi

      - name: Wait for sysprep to shut the builder down (windows)
        if: inputs.os == 'windows'
        run: |
          set -euo pipefail
          # The Windows bake ends with EC2Launch sysprep --shutdown, so
          # "stopped" IS the completion signal - no console marker to grep.
          # A healthy Windows bake reaches "stopped" in ~5 minutes (measured
          # 2026-09-11, run 34580578499). A failed bake stays running by
          # design, so 20 minutes is a generous ceiling, not a race.
          for i in $(seq 1 40); do
            STATE=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].State.Name' --output text)
            echo "$(date -u +%H:%M:%S) builder is $STATE"
            OUT=$(aws ec2 get-console-output --instance-id "$INSTANCE_ID" --output text --query Output 2>/dev/null || true)
            echo "$OUT" | grep -o 'BAKE [0-9:]* phase: [a-z0-9 ]*' | tail -1 || true
            if echo "$OUT" | grep -q 'BAKE-FAILED'; then
              echo "::error::$(echo "$OUT" | grep -o 'BAKE-FAILED.*' | tail -1)"
              exit 1
            fi
            if [ "$STATE" = "stopped" ]; then break; fi
            if [ "$STATE" = "terminated" ]; then echo "::error::builder terminated before sysprep finished"; exit 1; fi
            sleep 30
          done
          if [ "$STATE" != "stopped" ]; then
            echo "::error::builder did not reach stopped within 20 minutes - refusing to snapshot"
            exit 1
          fi

      - name: Snapshot into an AMI
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%d%H%M%S)
          if [ "${{ inputs.os }}" = "windows" ]; then
            VARIANT=windows
          else
            VARIANT=$([ "${{ inputs.gpu }}" = "true" ] && echo gpu || echo cpu)
          fi
          AMI_ID=$(aws ec2 create-image \
            --instance-id "$INSTANCE_ID" \
            --name "ephemeral-desktop-baked-$VARIANT-$STAMP" \
            --tag-specifications "ResourceType=image,Tags=[{Key=Project,Value=ephemeral-desktop},{Key=BakedAt,Value=$STAMP},{Key=Variant,Value=$VARIANT}]" \
            --query ImageId --output text)
          echo "baked AMI: $AMI_ID - waiting for it to become available"
          aws ec2 wait image-available --image-ids "$AMI_ID"
          echo "AMI_ID=$AMI_ID" >> "$GITHUB_ENV"
          echo "## AMI baked" >> "$GITHUB_STEP_SUMMARY"
          echo "$AMI_ID, tagged Project=ephemeral-desktop" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the builder for forensics (on failure)
        # GitHub's failure() is FALSE on cancellation, so a cancelled run (or
        # a killed runner) must be caught explicitly here too - otherwise the
        # builder is left running and billing with no forensics step ever
        # firing to stop it.
        if: (failure() || cancelled()) && env.INSTANCE_ID != ''
        run: |
          set -uo pipefail
          if [ "${{ inputs.os }}" = "windows" ]; then
            # Windows has no other log channel worth keeping: the only record
            # of what went wrong is C:\bake.log on the root volume, so the
            # builder is stopped (not terminated) and kept for forensics.
            STATE=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query 'Reservations[0].Instances[0].State.Name' --output text)
            [ "$STATE" = "running" ] && aws ec2 stop-instances --instance-ids "$INSTANCE_ID" >/dev/null && echo "stopping $INSTANCE_ID"
            VOL=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query 'Reservations[0].Instances[0].BlockDeviceMappings[0].Ebs.VolumeId' --output text)
            echo "::warning::builder $INSTANCE_ID kept STOPPED for forensics (root volume $VOL, ~\$4/month until deleted). Read C:\\bake.log by attaching $VOL to a Linux instance. Terminate the builder by hand when done."
            echo "## Bake FAILED - builder kept for forensics" >> "$GITHUB_STEP_SUMMARY"
            echo "instance \`$INSTANCE_ID\`, root volume \`$VOL\`. Read \`C:\\bake.log\` from the volume, then terminate the builder." >> "$GITHUB_STEP_SUMMARY"
          else
            # A Linux builder's console output is already readable (see the
            # "Wait for the image pull to finish" step above), and a stopped
            # GPU builder's root volume is just cost with no extra signal to
            # gain from keeping it - terminate it instead of leaving it billing.
            aws ec2 terminate-instances --instance-ids "$INSTANCE_ID" >/dev/null || true
            echo "::warning::linux bake failed/cancelled - builder $INSTANCE_ID terminated (no forensics kept for linux)"
            echo "## Bake FAILED - builder terminated (linux, no forensics needed)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Smoke-test the Windows AMI (DCV must answer on 443)
        if: inputs.os == 'windows'
        run: |
          set -euo pipefail
          # An image that boots but never starts DCV looks identical to a good
          # one until a user is staring at "Booting..." forever - three such
          # images shipped on 2026-09-11. Launch the AMI once with the smallest
          # possible user-data (start DCV as user-data will), wait for 443, and
          # only then let the tag stand. Failure deregisters the AMI so
          # Terraform's most_recent can never pick it.
          SUBNET=$(aws ec2 describe-subnets --filters "Name=default-for-az,Values=true" --query 'Subnets[0].SubnetId' --output text)
          VPC=$(aws ec2 describe-subnets --subnet-ids "$SUBNET" --query 'Subnets[0].VpcId' --output text)
          SG=$(aws ec2 create-security-group --group-name "ami-smoke-$AMI_ID" --description "temporary: AMI smoke test, 443 from the runner" --vpc-id "$VPC" --query GroupId --output text)
          echo "SMOKE_SG=$SG" >> "$GITHUB_ENV"
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          aws ec2 authorize-security-group-ingress --group-id "$SG" --protocol tcp --port 443 --cidr "$RUNNER_IP/32" >/dev/null
          cat > smoke-user-data.ps1 <<'EOF'
          <powershell>
          $dcv = "Registry::HKEY_USERS\S-1-5-18\Software\GSettings\com\nicesoftware\dcv"
          if (-not (Test-Path "$dcv\session-management\automatic-console-session")) { New-Item -Path "$dcv\session-management\automatic-console-session" -Force | Out-Null }
          Set-ItemProperty "$dcv\session-management\automatic-console-session" "owner" "Administrator" -Type String
          Set-Service dcvserver -StartupType Automatic
          Start-Service dcvserver
          </powershell>
          EOF
          SMOKE_ID=$(aws ec2 run-instances --image-id "$AMI_ID" --instance-type m6i.large \
            --subnet-id "$SUBNET" --security-group-ids "$SG" --associate-public-ip-address \
            --metadata-options "HttpTokens=required,HttpEndpoint=enabled" \
            --user-data file://smoke-user-data.ps1 \
            --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=ami-smoke-test}]' \
            --query 'Instances[0].InstanceId' --output text)
          echo "SMOKE_ID=$SMOKE_ID" >> "$GITHUB_ENV"
          aws ec2 wait instance-running --instance-ids "$SMOKE_ID"
          IP=$(aws ec2 describe-instances --instance-ids "$SMOKE_ID" --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          # Sysprepped first boot + DCV start: ~5-7 minutes on m6i.large. 15 is the ceiling.
          OK=0
          for i in $(seq 1 45); do
            CODE=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 8 "https://$IP/" || true)
            echo "$(date -u +%H:%M:%S) DCV https://$IP/ -> $CODE"
            if [ "$CODE" = "200" ]; then OK=1; break; fi
            sleep 20
          done
          if [ "$OK" -ne 1 ]; then
            echo "::error::DCV never answered on 443 from $AMI_ID - deregistering the image so it cannot be launched"
            SNAP=$(aws ec2 describe-images --image-ids "$AMI_ID" --query 'Images[0].BlockDeviceMappings[0].Ebs.SnapshotId' --output text)
            aws ec2 deregister-image --image-id "$AMI_ID"
            [ -n "$SNAP" ] && [ "$SNAP" != "None" ] && aws ec2 delete-snapshot --snapshot-id "$SNAP" || true
            # Keep the smoke instance STOPPED for forensics (same policy as a failed bake).
            aws ec2 stop-instances --instance-ids "$SMOKE_ID" >/dev/null || true
            echo "::warning::smoke instance $SMOKE_ID kept stopped for forensics; security group $SG left in place - delete both by hand"
            exit 1
          fi
          echo "## AMI verified" >> "$GITHUB_STEP_SUMMARY"
          echo "$AMI_ID answered DCV on 443 within the smoke test" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up the smoke test (on success)
        if: inputs.os == 'windows' && success()
        run: |
          aws ec2 terminate-instances --instance-ids "$SMOKE_ID" >/dev/null || true
          aws ec2 wait instance-terminated --instance-ids "$SMOKE_ID" || true
          aws ec2 delete-security-group --group-id "$SMOKE_SG" || true

      - name: Terminate the throwaway instance
        if: success()
        run: aws ec2 terminate-instances --instance-ids "$INSTANCE_ID" || true
