name: Desktop - START
# One label per user: the panel shows a user ONLY their own run and matches
# on this name (panel/lib/desktops.js runBelongsTo).
run-name: "Desktop - START · ${{ inputs.guest_username || 'owner' }} · ${{ inputs.os }}"

# Manual trigger only. This costs money the moment it succeeds, so it must
# never fire on a push.
on:
  workflow_dispatch:
    inputs:
      username:
        description: "Login username for the desktop"
        required: false
        default: "mnour"
      # DELIBERATELY REMOVED - do not add this back.
      #
      # A workflow_dispatch input is NOT masked in job logs the way a
      # secret is, and GitHub echoes each step's env block. On a PUBLIC
      # repository that publishes the password to anyone on the internet.
      # ::add-mask:: cannot save it either, because GitHub also echoes the
      # run script that would perform the masking.
      #
      # The password is generated by random_password instead. To make it
      # stop changing on every rebuild, move that resource into the
      # persistent stack - never route a secret through a public workflow.
      fresh:
        description: "Wipe the existing desktop and start clean (loses installed apps)"
        type: boolean
        default: false
      instance_type:
        description: "Instance type. Must be non-burstable - t-family throttles under video encoding."
        required: false
        default: "c7i.xlarge"
      # Everything below is for the guest self-service control panel at
      # desktop.sihaab.com, not for a human clicking "Run workflow". Left at
      # their defaults, this run is the owner's own desk.sihaab.com desktop,
      # unchanged from before this section existed.
      guest_username:
        description: "Empty for the owner's own desktop, or a username (from Google sign-in) for a per-user desktop at <username>.desktop.sihaab.com."
        required: false
        default: ""
      owner_email:
        description: "Guest email, for tagging and the history log only."
        required: false
        default: ""
      persist:
        description: "Keep the user's data after destroy. Guests were removed 2026-09-17; every caller now is a permanent user, so the panel always sends true."
        type: boolean
        default: false
      enable_access:
        description: "Gate this desktop behind Cloudflare Access (owner's Google account only). Requires the hostname to be PROXIED, which puts Selkies' WebSocket through Cloudflare's proxy - verify the stream still works before relying on it."
        type: boolean
        default: false
      is_guest:
        description: "Legacy: guests were removed 2026-09-17 and the panel always sends false. Kept so an old dispatch by hand still validates; true only adds the Role=guest-desktop tag."
        type: boolean
        default: false
      gpu:
        description: "Run on a GPU instance with hardware NVENC encoding instead of software x264. Removes encoder load from the CPU, which is the dominant cause of input lag. Costs ~3.2x/hour and requires a gpu-variant AMI."
        type: boolean
        default: false
      use_spot:
        description: "Spot cannot be stopped and resumed, only terminated - and every machine this panel builds is parked when unused. Default false. true is for a throwaway machine that will never sleep."
        type: boolean
        default: false
      os:
        description: "linux (default) or windows. Windows boots the baked Server 2025 + DCV image on instance_type_windows, always behind a Cloudflare-proxied hostname, with the user's NTFS volume as D:. Offered to every tier from the panel."
        type: choice
        options: [linux, windows]
        default: linux
      instance_type_windows:
        description: "Instance type when os=windows. c7i.xlarge (4 vCPU): m6i.large (2 vCPU) measured 4 fps / ~300 ms - DCV software encoding starves on 2 vCPU."
        required: false
        default: "c7i.xlarge"
      region:
        description: "AWS region. Only ap-south-1 (Mumbai) is offered: me-central-1 (UAE) throttles every launch for this account. This input is now a fixed single choice, not an access gate. The state key no longer varies by region (see the terraform apply step)."
        type: choice
        options: [ap-south-1]
        default: ap-south-1

permissions:
  contents: read

concurrency:
  # Per username AND OS: a user's Windows and Linux machines are independent,
  # so a Windows start must not queue behind a Linux one. Two runs for the SAME
  # machine still serialise, which is what protects the state lock.
  group: desktop-lifecycle-${{ inputs.guest_username }}-${{ inputs.os }}
  cancel-in-progress: false

jobs:
  start:
    name: terraform apply
    runs-on: ubuntu-latest

    # An unfulfillable spot request does NOT fail - terraform sits in "Still
    # creating..." until something kills it. Without this, that is GitHub's
    # 6-hour default: six hours of a held runner, a held concurrency slot, and
    # a state lock nobody can clear without `force-unlock`. Observed for real
    # on 2026-08-25 (two consecutive c7i.xlarge capacity stalls, cancelled by
    # hand at 11 and 19 minutes). 25 minutes is ~5x the worst healthy apply.
    timeout-minutes: 25

    # Measured on run 31376162950: the job took 112s, and 87s of that was the
    # single "terraform apply" step - most of it `terraform init` downloading
    # the same providers from scratch, every run. The AWS provider alone is
    # ~200MB+. Caching them by lockfile hash means a cache hit skips the
    # download entirely, and the lockfile is exactly the right key: it changes
    # if and only if a provider version changes.
    env:
      AWS_REGION: ${{ inputs.region }}
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tf-plugin-cache

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7

      # One region, one zone: ap-south-1c (cheapest measured zone, and the
      # only region this app uses since 2026-09-17).
      - name: Map region to its AZ suffix
        run: |
          echo "AZ_SUFFIX=c" >> "$GITHUB_ENV"
          echo "AWS_AZ=ap-south-1c" >> "$GITHUB_ENV"

      - name: Cache Terraform providers
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.tf-plugin-cache
          key: tf-providers-${{ hashFiles('terraform/.terraform.lock.hcl') }}
          restore-keys: tf-providers-

      - name: Configure AWS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY secrets are not set."
            echo "Add them under Settings > Secrets and variables > Actions."
            echo "These become unnecessary once the IAM policy in"
            echo "docs/aws-permissions-policy.json is attached and OIDC replaces them."
            exit 1
          fi
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=$AWS_REGION" >> "$GITHUB_ENV"

      - name: Guest-only setup (volume, password)
        if: inputs.guest_username != ''
        run: |
          set -euo pipefail
          GUEST_USERNAME="${{ inputs.guest_username }}"

          # A guest who wants to keep their data gets ONE volume, reused on
          # every future session. A Terraform data source cannot express
          # "create this if it does not exist" - so that check-then-create
          # happens here, with real AWS credentials, before apply runs at all.
          # One volume per (user, OS): a Linux volume is ext4 carrying
          # containerd state, Windows needs NTFS - they cannot be shared.
          if [ "${{ inputs.os }}" = "windows" ]; then ROLE=desktop-guest-data-windows; SIZE=20; else ROLE=desktop-guest-data; SIZE=15; fi
          if [ "${{ inputs.persist }}" = "true" ]; then
            VOL_ID=$(aws ec2 describe-volumes \
              --filters "Name=tag:Owner,Values=$GUEST_USERNAME" "Name=tag:Role,Values=$ROLE" \
              --query 'Volumes[0].VolumeId' --output text)
            if [ "$VOL_ID" = "None" ] || [ -z "$VOL_ID" ]; then
              VOL_ID=$(aws ec2 create-volume \
                --region "$AWS_REGION" --availability-zone "$AWS_AZ" \
                --size "$SIZE" --volume-type gp3 --encrypted \
                --tag-specifications "ResourceType=volume,Tags=[{Key=Owner,Value=$GUEST_USERNAME},{Key=Role,Value=$ROLE},{Key=ManagedBy,Value=workflow}]" \
                --query VolumeId --output text)
              echo "created $ROLE volume $VOL_ID for $GUEST_USERNAME"
            else
              echo "reusing existing $ROLE volume $VOL_ID for $GUEST_USERNAME"
            fi
            echo "TF_VAR_user_volume_id=$VOL_ID" >> "$GITHUB_ENV"

            # A per-guest password - but NOT a fresh one every time. user-data.sh.tpl
            # bind-mounts containerd's storage onto this same volume so that
            # installed packages survive a destroy, which means the webtop
            # CONTAINER itself survives too: `docker inspect webtop` finds it
            # on the new instance and `docker start`s it rather than recreating
            # it. `docker start` cannot change a container's env vars, so the
            # CUSTOM_USER/PASSWORD it was originally created with keeps being
            # what it actually checks logins against - forever - no matter what
            # password this run generates and hands to the panel.
            #
            # Found from a real report: the panel showed a fresh password after
            # a persist=true restart, and it did not work - the container was
            # still running with the password from its first-ever creation.
            #
            # Fixed by making the password stick to the volume the same way
            # the container already does: store it as a tag on first creation,
            # read it back on every later run instead of generating a new one.
            # Tags, not SSM Parameter Store, because this script's AWS
            # credentials are already proven to have ec2:CreateTags/DescribeVolumes
            # (used two lines above) - reusing that avoids needing a new grant
            # for a permission set that may not be attached.
            GUEST_PASSWORD=$(aws ec2 describe-tags \
              --filters "Name=resource-id,Values=$VOL_ID" "Name=key,Values=DesktopPassword" \
              --query 'Tags[0].Value' --output text)
            if [ "$GUEST_PASSWORD" = "None" ] || [ -z "$GUEST_PASSWORD" ]; then
              GUEST_PASSWORD="$(openssl rand -hex 16)"
              aws ec2 create-tags --resources "$VOL_ID" --tags "Key=DesktopPassword,Value=$GUEST_PASSWORD"
              echo "generated and stored a new password for $GUEST_USERNAME's volume"
            else
              echo "reusing $GUEST_USERNAME's stored password - their desktop container survives on this volume, so a fresh password here would not match what it actually runs with"
            fi
          else
            echo "persist=false - no volume, session is fully ephemeral"
            echo "TF_VAR_user_volume_id=" >> "$GITHUB_ENV"

            # No volume means no surviving container to mismatch - a fresh
            # password every time is correct and simpler here.
            GUEST_PASSWORD="$(openssl rand -hex 16)"
          fi

          # Never the owner's persistent-stack password - that would hand
          # every guest the same credential the owner uses.
          echo "TF_VAR_web_password_override=$GUEST_PASSWORD" >> "$GITHUB_ENV"
          echo "::add-mask::$GUEST_PASSWORD"

      - name: Per-session reclaim token
        if: inputs.guest_username != '' && inputs.os != 'windows'
        run: |
          # Generated HERE, never a workflow_dispatch input (public repo). The
          # machine gets it through user_data and uses it to report a spot
          # reclaim to the panel (panel/api/session-lost.js); the panel is
          # handed it once in session-ready and keeps only a hash.
          T=$(openssl rand -hex 24)
          echo "::add-mask::$T"
          echo "TF_VAR_session_token=$T" >> "$GITHUB_ENV"

      - name: Release a stale Terraform lock left by a killed run
        if: inputs.guest_username != ''
        run: |
          # A run killed by timeout-minutes (a spot request that never filled,
          # 2026-09-14) leaves its S3 lock behind, and every later start or
          # destroy for that user then fails "Error acquiring the state lock"
          # forever - guest arqqin was locked out for a day. This job holds the
          # per-user concurrency group, so no other start/destroy for this user
          # can be running. The reaper is in its own group but its job times out
          # at 30 min, so a lock older than an hour belongs to no live run.
          set -uo pipefail
          # Per user AND per OS: a user has one Linux and one Windows machine, and one OS's apply must never overwrite the other's state.
          KEY="desktop/user-${{ inputs.guest_username }}/${{ inputs.os }}/terraform.tfstate"
          BUCKET=ephemeral-desktop-643902831477-tfstate
          LOCK=$(aws s3 cp "s3://$BUCKET/$KEY.tflock" - --region me-central-1 2>/dev/null) || { echo "no lock on $KEY"; exit 0; }
          CREATED=$(echo "$LOCK" | jq -r '.Created // empty' 2>/dev/null || true)
          # date -d "" means "today 00:00", which would read as old - reject it explicitly
          CREATED_S=$([ -n "$CREATED" ] && date -u -d "$CREATED" +%s 2>/dev/null) || { echo "::warning::unparseable lock on $KEY - leaving it"; exit 0; }
          AGE=$(( $(date -u +%s) - CREATED_S ))
          if [ "$AGE" -gt 3600 ]; then
            aws s3 rm "s3://$BUCKET/$KEY.tflock" --region me-central-1
            echo "::warning::removed an orphaned Terraform lock (${AGE}s old) on $KEY"
          else
            echo "lock on $KEY is ${AGE}s old - leaving it; terraform -lock-timeout will wait"
          fi

      - name: terraform apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_web_user: ${{ inputs.username }}
          TF_VAR_fresh: ${{ inputs.fresh }}
          TF_VAR_instance_type: ${{ inputs.instance_type }}
          TF_VAR_username: ${{ inputs.guest_username }}
          TF_VAR_owner_email: ${{ inputs.owner_email }}
          TF_VAR_cloudflare_dns_api_token: ${{ inputs.guest_username != '' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          TF_VAR_enable_access: ${{ inputs.enable_access }}
          TF_VAR_is_guest: ${{ inputs.is_guest }}
          TF_VAR_use_spot: ${{ inputs.use_spot }}
          TF_VAR_gpu: ${{ inputs.gpu }}
          TF_VAR_os: ${{ inputs.os }}
          TF_VAR_instance_type_windows: ${{ inputs.instance_type_windows }}
          TF_VAR_region: ${{ inputs.region }}
          TF_VAR_az_suffix: ${{ env.AZ_SUFFIX }}
          TF_VAR_panel_url: ${{ vars.PANEL_URL || 'https://desktop.sihaab.com' }}
        run: |
          KEY="desktop/terraform.tfstate"
          if [ -n "${{ inputs.guest_username }}" ]; then
            # Per user AND per OS: a user has one Linux and one Windows machine, and one OS's apply must never overwrite the other's state.
            KEY="desktop/user-${{ inputs.guest_username }}/${{ inputs.os }}/terraform.tfstate"
          fi
          # -lock-timeout instead of failing instantly: the reaper, a manual
          # destroy and this apply can all target one username's state, and
          # "someone else holds the lock for 4 more seconds" should be a wait,
          # not a hard error that leaves the user staring at a failed run.
          terraform -chdir=terraform init -input=false -lock-timeout=180s -backend-config="key=$KEY"
          if terraform -chdir=terraform apply -auto-approve -input=false -lock-timeout=180s -no-color 2>&1 | tee /tmp/apply.log; then
            exit 0
          fi

          # Spot first, on-demand if there is no spot capacity. The aws_instance
          # create timeout (5m, terraform/main.tf) turns "no capacity" from a
          # 25-minute hang into this failure. Only for Linux spot, and only
          # when the ERROR is about capacity: the plan above the error prints
          # words like capacity_reservation_specification, so the search starts
          # at the first "Error:" line. Any other failure is a real failure.
          if [ "${{ inputs.os }}" = "windows" ] || [ "$TF_VAR_use_spot" != "true" ] || \
             ! sed -n '/Error:/,$p' /tmp/apply.log | grep -qE "InsufficientInstanceCapacity|capacity-not-available|MaxSpotInstanceCountExceeded|timeout while waiting for state to become 'running'|context deadline exceeded"; then
            exit 1
          fi
          echo "::warning::no spot capacity - retrying on a regular on-demand machine"

          # No hand-rolled cleanup: a create that timed out is saved in state
          # as tainted, and this apply destroys it before creating the
          # on-demand machine. (Terminating by tag was tried in review and
          # could match the owner's own desktop - Owner is a default tag.)
          export TF_VAR_use_spot=false
          echo "TF_VAR_use_spot=false" >> "$GITHUB_ENV"
          terraform -chdir=terraform apply -auto-approve -input=false -lock-timeout=180s

      - name: Tell desktop.sihaab.com the guest session is ready
        # The control panel holds no AWS or Terraform credentials - by design,
        # so a compromised panel can never touch infrastructure directly. It
        # cannot read `terraform output` itself, so the guest's URL and
        # password have to be handed to it here, once, right after apply.
        if: inputs.guest_username != ''
        env:
          HUB_CALLBACK_SECRET: ${{ secrets.HUB_CALLBACK_SECRET }}
          # Repo variable, not a secret - this is a public URL, and this repo
          # is public. The fallback keeps every callback working if the
          # variable is never set, so a domain move is one variable edit
          # rather than a hunt through four workflows.
          PANEL_URL: ${{ vars.PANEL_URL || 'https://desktop.sihaab.com' }}
        run: |
          URL=$(terraform -chdir=terraform output -raw url)
          PASSWORD=$(terraform -chdir=terraform output -raw admin_password)
          INSTANCE_ID=$(terraform -chdir=terraform output -raw instance_id)
          LOGIN_USER=$(terraform -chdir=terraform output -raw login_user)
          MARKET=$(terraform -chdir=terraform output -raw market)
          LAUNCHED_AT=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].LaunchTime' --output text | \
            xargs -I{} date -u -d {} +%s)
          if [ -z "$HUB_CALLBACK_SECRET" ]; then
            echo "::error::HUB_CALLBACK_SECRET is not set - the guest has no way to learn their URL or password. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          # owner_email is a FALLBACK only. The hub prefers the email it
          # recorded at dispatch time from a verified Google session, so this
          # value cannot be used to reassign a desktop to someone else. It
          # matters when the hub has no prior state - a hub restart mid-run, or
          # a desktop recovered after a partially-failed apply - where losing
          # the owner leaves a desktop nobody can destroy from the panel.
          PAYLOAD=$(jq -n \
            --arg username "${{ inputs.guest_username }}" \
            --arg url "$URL" \
            --arg password "$PASSWORD" \
            --arg owner_email "${{ inputs.owner_email }}" \
            --arg launched_at "$LAUNCHED_AT" \
            --arg login_user "$LOGIN_USER" \
            --arg os "${{ inputs.os }}" \
            --arg region "${{ inputs.region }}" \
            --arg market "$MARKET" \
            --arg instance_id "$INSTANCE_ID" \
            --arg session_token "${TF_VAR_session_token:-}" \
            '{username:$username, url:$url, password:$password, owner_email:$owner_email, launched_at:($launched_at|tonumber), login_user:$login_user, os:$os, region:$region, market:$market, instance_id:$instance_id, session_token:$session_token}')
          curl -fsS -X POST "$PANEL_URL/api/session-ready" \
            -H "Authorization: Bearer $HUB_CALLBACK_SECRET" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
          echo "::add-mask::$PASSWORD"

      - name: Where it is, and what it costs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          URL=$(terraform -chdir=terraform output -raw url)
          {
            echo "## Desktop started"
            echo ""
            echo "**$URL** - allow ~80 seconds for the container and TLS to settle."
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Username | \`${{ inputs.username }}\` |"
            echo "| Fresh start | \`${{ inputs.fresh }}\` |"
            echo "| OS | \`${{ inputs.os }}\` |"
            echo "| Region | \`${{ inputs.region }}\` |"
            echo "| Instance | \`${{ inputs.os == 'windows' && inputs.instance_type_windows || inputs.instance_type }}\` |"
            echo ""
            echo "The password is NOT printed here - job logs are readable by anyone"
            echo "with repo access. Retrieve it with:"
            echo ""
            echo '```'
            echo "terraform -chdir=terraform output -raw admin_password"
            echo '```'
            echo ""
            echo "> This is now billing at roughly \$0.10/hour. Run **Desktop - DESTROY**"
            echo "> when finished; your data survives."
          } >> "$GITHUB_STEP_SUMMARY"
