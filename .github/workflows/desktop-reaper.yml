name: Desktop - REAPER

# Guests were removed 2026-09-17. This workflow used to compare each guest
# instance's LaunchTime against a time limit from the admin console and
# destroy anything past it. There is no time limit left to enforce, so it
# no longer destroys anything - it stays as a cheap visibility pass until
# Plan C gives it the job of parking machines that are running with nobody
# connected.
#
# There is no fixed list of usernames to loop over - discovery is by AWS
# tag (Stack=desktop), not a hardcoded set.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: desktop-reaper
  cancel-in-progress: false

jobs:
  reap:
    name: report anything running
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::AWS secrets are not set."
            exit 1
          fi
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"

      - name: Report any desktop that is running
        run: |
          # Guests were removed on 2026-09-17, so there is no time limit left to
          # enforce and this workflow destroys nothing. It stays as a cheap
          # visibility pass until Plan C gives it the job of parking machines
          # that are running with nobody connected.
          set -uo pipefail
          ROWS=$(aws ec2 describe-instances --region ap-south-1 \
            --filters "Name=tag:Stack,Values=desktop" "Name=instance-state-name,Values=running,pending" \
            --query 'Reservations[].Instances[].[InstanceId,Tags[?Key==`Owner`]|[0].Value,LaunchTime]' \
            --output text)
          if [ -z "$ROWS" ]; then
            echo "no desktops running"
          else
            echo "$ROWS"
          fi
