name: Desktop - REAPER

# Guest sessions get a KillAt tag at launch (see desktop-up.yml). Nothing
# else enforces it - a guest who closes the tab and never clicks Destroy
# would otherwise bill $0.104/hr indefinitely. This is the clock that makes
# the session cap real instead of aspirational.
#
# Only ever touches guest slots (a/b). The owner's own desktop has no KillAt
# tag and is never force-destroyed by this workflow.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # manual run, for testing this workflow itself

permissions:
  contents: read

jobs:
  reap:
    name: destroy anything past its KillAt time
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7

      - name: Configure AWS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::AWS secrets are not set."
            exit 1
          fi
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=eu-central-1" >> "$GITHUB_ENV"

      - name: Check both slots and destroy anything overdue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HUB_CALLBACK_SECRET: ${{ secrets.HUB_CALLBACK_SECRET }}
        run: |
          set -uo pipefail
          NOW=$(date -u +%s)

          for SLOT in a b; do
            KILL_AT=$(aws ec2 describe-instances --region eu-central-1 \
              --filters "Name=tag:Slot,Values=$SLOT" "Name=instance-state-name,Values=running,pending" \
              --query 'Reservations[0].Instances[0].Tags[?Key==`KillAt`].Value | [0]' \
              --output text 2>/dev/null)

            if [ -z "$KILL_AT" ] || [ "$KILL_AT" = "None" ]; then
              echo "slot $SLOT: nothing running, or no KillAt tag - skipping"
              continue
            fi

            KILL_TS=$(date -u -d "$KILL_AT" +%s 2>/dev/null || echo 0)
            if [ "$KILL_TS" -le "$NOW" ]; then
              echo "slot $SLOT: KillAt=$KILL_AT has passed - destroying"
              terraform -chdir=terraform init -input=false -reconfigure \
                -backend-config="key=desktop/slot-$SLOT/terraform.tfstate"
              TF_VAR_slot="$SLOT" terraform -chdir=terraform destroy -auto-approve -input=false

              if [ -n "${HUB_CALLBACK_SECRET:-}" ]; then
                curl -fsS -X POST "https://hub.mnour.dev/control/api/session-ended" \
                  -H "Authorization: Bearer $HUB_CALLBACK_SECRET" \
                  -H "Content-Type: application/json" \
                  -d "{\"slot\":\"$SLOT\",\"reason\":\"reaped\"}" \
                  || echo "::warning::callback to hub failed for slot $SLOT - destroy already succeeded"
              fi
            else
              echo "slot $SLOT: KillAt=$KILL_AT is still in the future - leaving it"
            fi
          done
