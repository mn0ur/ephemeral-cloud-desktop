<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0A1128">
<title>Sihaab · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/sihaab.css">
<script>
  (function () {
    var root = document.documentElement, theme;
    try { theme = localStorage.getItem('sihaab-theme'); } catch (e) {}
    if (theme !== 'light' && theme !== 'dark') {
      theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    root.dataset.theme = theme;
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'light' ? '#FAF7F0' : '#0A1128');
  })();
</script>
</head>
<body>
<div class="sky" aria-hidden="true"></div>

<header>
  <div class="wrap wide nav">
    <a class="name" href="/"><img src="/logo-96.png" alt="" width="40" height="40">SIHAAB</a><span class="chip">admin</span>
    <div class="controls">
      <button id="theme-toggle" class="toggle" type="button" aria-label="Toggle dark or light mode">
        <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap wide">

  <div class="card">
    <div id="g-wrap" class="g-wrap"></div>
    <div id="g-signed" class="signed-in" style="display:none">
      <span id="g-email"></span><button id="g-signout" type="button">Sign out</button>
    </div>
    <div id="g-disabled" class="sub" style="display:none;text-align:center;padding:1rem 0">
      Sign-in is not configured on this deployment.</div>
    <div id="not-admin" class="sub" style="display:none;text-align:center;padding:1rem 0">
      Signed in, but this account is not an admin.</div>
    <div id="err" class="err"></div>
  </div>

  <div id="sessions-card" class="card" style="display:none">
    <div class="kicker">Live</div>
    <h2>All sessions</h2>
    <div id="sessions"></div>
  </div>

  <div id="tiers-card" class="card" style="display:none">
    <div class="kicker">Access</div>
    <h2>Admins</h2>
    <div id="admin-list"></div>
    <div class="row">
      <input id="admin-email" type="email" placeholder="email@example.com">
      <button id="admin-add" class="go" type="button" style="flex:0 0 auto;min-width:0">Add</button>
    </div>

    <h2 style="margin-top:28px">Permanent users</h2>
    <div id="permanent-list"></div>
    <div class="row">
      <input id="permanent-email" type="email" placeholder="email@example.com">
      <button id="permanent-add" class="go" type="button" style="flex:0 0 auto;min-width:0">Add</button>
    </div>
  </div>

  <div id="history-card" class="card" style="display:none">
    <div class="kicker">Audit</div>
    <h2>History</h2>
    <div id="history" class="table-wrap"></div>
  </div>
</main>

<script>
  document.getElementById('theme-toggle').addEventListener('click', function () {
    var root = document.documentElement;
    var next = root.dataset.theme === 'light' ? 'dark' : 'light';
    root.dataset.theme = next;
    try { localStorage.setItem('sihaab-theme', next); } catch (e) {}
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', next === 'light' ? '#FAF7F0' : '#0A1128');
  });
</script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="/admin.js"></script>
</body>
</html>
