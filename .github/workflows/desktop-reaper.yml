name: Desktop - REAPER

# Guests were removed 2026-09-17. This workflow used to compare each guest
# instance's LaunchTime against a time limit from the admin console and
# destroy anything past it. There is no time limit left to enforce, so it
# no longer destroys anything - it stays as a cheap visibility pass until
# Plan C gives it the job of parking machines that are running with nobody
# connected.
#
# There is no fixed list of usernames to loop over - discovery is by AWS
# tag (Stack=desktop), not a hardcoded set.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: desktop-reaper
  cancel-in-progress: false

jobs:
  reap:
    name: report anything running
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::AWS secrets are not set."
            exit 1
          fi
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"

      - name: Report any desktop that is running
        run: |
          # Guests were removed on 2026-09-17, so there is no time limit left to
          # enforce and this workflow destroys nothing. It stays as a cheap
          # visibility pass until Plan C gives it the job of parking machines
          # that are running with nobody connected.
          #
          # Read-only: describe-instances only, never a mutating AWS call.
          # The run shell is `bash -eo pipefail`, so every step below is
          # written to still exit 0 on an empty result set, an unparseable
          # LaunchTime, or an owner tag of `None`.
          set -uo pipefail
          ROWS=$(aws ec2 describe-instances --region ap-south-1 \
            --filters "Name=tag:Stack,Values=desktop" "Name=instance-state-name,Values=running,pending" \
            --query 'Reservations[].Instances[].[InstanceId,Tags[?Key==`Owner`]|[0].Value,LaunchTime]' \
            --output text || true)

          {
            echo "### Running desktops"
            echo ""
            echo "| Owner | Instance | Age |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$ROWS" ]; then
            echo "no desktops running"
            echo "_no desktops running_" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          NOW=$(date -u +%s)
          while IFS=$'\t' read -r INSTANCE_ID OWNER LAUNCH_TIME; do
            [ -z "$INSTANCE_ID" ] && continue
            OWNER_DISPLAY="$OWNER"
            if [ -z "$OWNER_DISPLAY" ] || [ "$OWNER_DISPLAY" = "None" ]; then
              OWNER_DISPLAY="unknown"
            fi

            LAUNCH_EPOCH=$(date -u -d "$LAUNCH_TIME" +%s 2>/dev/null || true)
            if [ -z "$LAUNCH_EPOCH" ]; then
              echo "$OWNER_DISPLAY $INSTANCE_ID age unknown (unparseable LaunchTime: $LAUNCH_TIME)"
              echo "| $OWNER_DISPLAY | $INSTANCE_ID | unknown |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            AGE_H=$(( (NOW - LAUNCH_EPOCH) / 3600 ))
            echo "$OWNER_DISPLAY $INSTANCE_ID ${AGE_H}h"
            echo "| $OWNER_DISPLAY | $INSTANCE_ID | ${AGE_H}h |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$AGE_H" -gt 8 ]; then
              echo "::warning::$OWNER_DISPLAY has been running for ${AGE_H}h"
            fi
          done <<< "$ROWS"

          exit 0
