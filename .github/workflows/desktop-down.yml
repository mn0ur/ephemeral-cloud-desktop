name: Desktop - DESTROY
# One label per user: the panel shows a user ONLY their own run and matches
# on this name (panel/lib/desktops.js runBelongsTo).
run-name: "Desktop - DESTROY · ${{ inputs.guest_username || 'owner' }}"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DESTROY to confirm'
        required: true
        default: ""
      guest_username:
        description: "Empty for the owner's own desktop, or the username of a per-user desktop to destroy."
        required: false
        default: ""
      enable_access:
        description: "Must MATCH what the desktop was started with. Terraform needs the same value to destroy the Access apps it created, and to leave the DNS record's proxied flag alone on teardown."
        type: boolean
        default: false
      os:
        description: "Which OS this session runs. Terraform must evaluate the same variant it applied; the panel sends the session's recorded os."
        type: choice
        options: [linux, windows]
        default: linux
      region:
        description: "Which region this session runs in. Terraform must evaluate the same region+AZ it applied; the panel sends the session's recorded region."
        type: choice
        options: [ap-south-1]
        default: ap-south-1

permissions:
  contents: read

concurrency:
  # Must match the formula in desktop-up.yml exactly, or a destroy could
  # race a start for the SAME username while a different username runs
  # in parallel undisturbed.
  group: desktop-lifecycle-${{ inputs.guest_username }}
  cancel-in-progress: false

jobs:
  destroy:
    name: terraform destroy
    runs-on: ubuntu-latest

    # A destroy that hangs holds this username's concurrency slot and its state
    # lock, so the user cannot retry and the reaper cannot step in either.
    # Fail fast instead of burning GitHub's 6-hour default.
    timeout-minutes: 15

    # Measured: 119s total, 109s of it inside "terraform destroy" - and a
    # large part of that is `terraform init` re-downloading providers. Same
    # cache and same key as desktop-up.yml, so a start warms the cache that
    # the following destroy then hits.
    env:
      AWS_REGION: ${{ inputs.region }}
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tf-plugin-cache

    steps:
      # A typed confirmation, because this is one click away from tearing down
      # a running machine someone might be working in.
      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "DESTROY" ]; then
            echo "::error::Confirmation failed. Type DESTROY exactly."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7

      # One region, one zone: ap-south-1c (cheapest measured zone, and the
      # only region this app uses since 2026-09-17).
      - name: Map region to its AZ suffix
        run: |
          echo "AZ_SUFFIX=c" >> "$GITHUB_ENV"

      - name: Prepare provider cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.tf-plugin-cache
          key: tf-providers-${{ hashFiles('terraform/.terraform.lock.hcl') }}
          restore-keys: tf-providers-

      - name: Configure AWS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::AWS secrets are not set. See Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=$AWS_REGION" >> "$GITHUB_ENV"

      # Only the desktop stack. The persistent volume lives in
      # terraform/persistent and the monitoring box in terraform/hub - neither
      # is touched here, which is the entire reason they are separate stacks.
      # A guest's own data volume (terraform/main.tf's guest_data attachment)
      # is likewise never destroyed here - only detached, same as the owner's.
      - name: Release a stale Terraform lock left by a killed run
        if: inputs.guest_username != ''
        run: |
          # A run killed by timeout-minutes (a spot request that never filled,
          # 2026-09-14) leaves its S3 lock behind, and every later start or
          # destroy for that user then fails "Error acquiring the state lock"
          # forever - guest arqqin was locked out for a day. This job holds the
          # per-user concurrency group, so no other start/destroy for this user
          # can be running. The reaper is in its own group but its job times out
          # at 30 min, so a lock older than an hour belongs to no live run.
          set -uo pipefail
          KEY="desktop/user-${{ inputs.guest_username }}/terraform.tfstate"
          BUCKET=ephemeral-desktop-643902831477-tfstate
          LOCK=$(aws s3 cp "s3://$BUCKET/$KEY.tflock" - --region me-central-1 2>/dev/null) || { echo "no lock on $KEY"; exit 0; }
          CREATED=$(echo "$LOCK" | jq -r '.Created // empty' 2>/dev/null || true)
          # date -d "" means "today 00:00", which would read as old - reject it explicitly
          CREATED_S=$([ -n "$CREATED" ] && date -u -d "$CREATED" +%s 2>/dev/null) || { echo "::warning::unparseable lock on $KEY - leaving it"; exit 0; }
          AGE=$(( $(date -u +%s) - CREATED_S ))
          if [ "$AGE" -gt 3600 ]; then
            aws s3 rm "s3://$BUCKET/$KEY.tflock" --region me-central-1
            echo "::warning::removed an orphaned Terraform lock (${AGE}s old) on $KEY"
          else
            echo "lock on $KEY is ${AGE}s old - leaving it; terraform -lock-timeout will wait"
          fi

      - name: terraform destroy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_username: ${{ inputs.guest_username }}
          TF_VAR_cloudflare_dns_api_token: ${{ inputs.guest_username != '' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          TF_VAR_enable_access: ${{ inputs.enable_access }}
          TF_VAR_os: ${{ inputs.os }}
          TF_VAR_region: ${{ inputs.region }}
          TF_VAR_az_suffix: ${{ env.AZ_SUFFIX }}
        run: |
          KEY="desktop/terraform.tfstate"
          if [ -n "${{ inputs.guest_username }}" ]; then
            # Must match the KEY rule in desktop-up.yml exactly, or this
            # destroy targets an empty state instead of the one the session
            # actually applied.
            KEY="desktop/user-${{ inputs.guest_username }}/terraform.tfstate"
          fi
          # See desktop-up.yml: lock contention with the reaper or a racing
          # apply should be a short wait, not an immediate failure.
          terraform -chdir=terraform init -input=false -lock-timeout=180s -backend-config="key=$KEY"
          terraform -chdir=terraform destroy -auto-approve -input=false -lock-timeout=180s

      - name: Tell desktop.sihaab.com this username is free
        if: inputs.guest_username != ''
        env:
          HUB_CALLBACK_SECRET: ${{ secrets.HUB_CALLBACK_SECRET }}
          PANEL_URL: ${{ vars.PANEL_URL || 'https://desktop.sihaab.com' }}
        run: |
          if [ -z "$HUB_CALLBACK_SECRET" ]; then
            echo "::warning::HUB_CALLBACK_SECRET not set - the control panel will not learn this session ended until its next status poll notices /healthz stopped answering."
            exit 0
          fi
          curl -fsS -X POST "$PANEL_URL/api/session-ended" \
            -H "Authorization: Bearer $HUB_CALLBACK_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${{ inputs.guest_username }}\",\"reason\":\"manual\"}" \
            || echo "::warning::callback failed - non-fatal, destroy already succeeded"

      - name: Confirm nothing billable is left
        run: |
          RUNNING=$(aws ec2 describe-instances --region "$AWS_REGION" \
            --filters "Name=tag:Stack,Values=desktop" "Name=instance-state-name,Values=running,pending" \
            --query 'length(Reservations[].Instances[])' --output text 2>/dev/null || echo "?")
          {
            echo "## Desktop destroyed"
            echo ""
            echo "Desktop instances still running: **$RUNNING**"
            echo ""
            echo "Your data is safe - the 20GB volume is in a separate stack and"
            echo "was not touched. The next START restores the browser profile and"
            echo "every package installed inside the desktop."
            echo ""
            echo "Remaining cost: ~\$0.80/month for the volume."
          } >> "$GITHUB_STEP_SUMMARY"
