name: Desktop - START

# Manual trigger only. This costs money the moment it succeeds, so it must
# never fire on a push.
on:
  workflow_dispatch:
    inputs:
      username:
        description: "Login username for the desktop"
        required: false
        default: "mnour"
      # DELIBERATELY REMOVED - do not add this back.
      #
      # A workflow_dispatch input is NOT masked in job logs the way a
      # secret is, and GitHub echoes each step's env block. On a PUBLIC
      # repository that publishes the password to anyone on the internet.
      # ::add-mask:: cannot save it either, because GitHub also echoes the
      # run script that would perform the masking.
      #
      # The password is generated by random_password instead. To make it
      # stop changing on every rebuild, move that resource into the
      # persistent stack - never route a secret through a public workflow.
      fresh:
        description: "Wipe the existing desktop and start clean (loses installed apps)"
        type: boolean
        default: false
      instance_type:
        description: "Instance type. Must be non-burstable - t-family throttles under video encoding."
        required: false
        default: "c7i.xlarge"
      # Everything below is for the guest self-service control panel at
      # desktop.mnour.dev, not for a human clicking "Run workflow". Left at
      # their defaults, this run is the owner's own desk.mnour.dev desktop,
      # unchanged from before this section existed.
      guest_username:
        description: "Empty for the owner's own desktop, or a username (from Google sign-in) for a per-user desktop at <username>.desktop.mnour.dev."
        required: false
        default: ""
      owner_email:
        description: "Guest email, for tagging and the history log only."
        required: false
        default: ""
      persist:
        description: "Guest chose to keep their data after destroy."
        type: boolean
        default: false
      enable_access:
        description: "Gate this desktop behind Cloudflare Access (owner's Google account only). Requires the hostname to be PROXIED, which puts Selkies' WebSocket through Cloudflare's proxy - verify the stream still works before relying on it."
        type: boolean
        default: false
      is_guest:
        description: "True if this session is a guest (no persist option, subject to the reaper's time limit). Set by the panel; false for anything dispatched by hand."
        type: boolean
        default: false
      use_spot:
        description: "Spot is ~4x cheaper but can be unfulfillable - c7i.xlarge in ap-south-1c had no capacity twice on 2026-08-25, and a spot request that is never fulfilled just hangs the apply until the job timeout. Set false to retry the same session on-demand instead of waiting for capacity."
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Per-username, not global: two different guests must never queue behind
  # each other, and neither may race a second apply targeting the SAME
  # username. Empty username -> "desktop-lifecycle-", the owner's own group,
  # unchanged from before this section existed.
  group: desktop-lifecycle-${{ inputs.guest_username }}
  cancel-in-progress: false

jobs:
  start:
    name: terraform apply
    runs-on: ubuntu-latest

    # An unfulfillable spot request does NOT fail - terraform sits in "Still
    # creating..." until something kills it. Without this, that is GitHub's
    # 6-hour default: six hours of a held runner, a held concurrency slot, and
    # a state lock nobody can clear without `force-unlock`. Observed for real
    # on 2026-08-25 (two consecutive c7i.xlarge capacity stalls, cancelled by
    # hand at 11 and 19 minutes). 25 minutes is ~5x the worst healthy apply.
    timeout-minutes: 25

    # Measured on run 31376162950: the job took 112s, and 87s of that was the
    # single "terraform apply" step - most of it `terraform init` downloading
    # the same providers from scratch, every run. The AWS provider alone is
    # ~200MB+. Caching them by lockfile hash means a cache hit skips the
    # download entirely, and the lockfile is exactly the right key: it changes
    # if and only if a provider version changes.
    env:
      AWS_REGION: ap-south-1
      AWS_AZ: ap-south-1c
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tf-plugin-cache

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7

      - name: Cache Terraform providers
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.tf-plugin-cache
          key: tf-providers-${{ hashFiles('terraform/.terraform.lock.hcl') }}
          restore-keys: tf-providers-

      - name: Configure AWS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY secrets are not set."
            echo "Add them under Settings > Secrets and variables > Actions."
            echo "These become unnecessary once the IAM policy in"
            echo "docs/aws-permissions-policy.json is attached and OIDC replaces them."
            exit 1
          fi
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=$AWS_REGION" >> "$GITHUB_ENV"

      - name: Guest-only setup (volume, password)
        if: inputs.guest_username != ''
        run: |
          set -euo pipefail
          GUEST_USERNAME="${{ inputs.guest_username }}"

          # A guest who wants to keep their data gets ONE volume, reused on
          # every future session. A Terraform data source cannot express
          # "create this if it does not exist" - so that check-then-create
          # happens here, with real AWS credentials, before apply runs at all.
          if [ "${{ inputs.persist }}" = "true" ]; then
            VOL_ID=$(aws ec2 describe-volumes \
              --filters "Name=tag:Owner,Values=$GUEST_USERNAME" "Name=tag:Role,Values=desktop-guest-data" \
              --query 'Volumes[0].VolumeId' --output text)
            if [ "$VOL_ID" = "None" ] || [ -z "$VOL_ID" ]; then
              VOL_ID=$(aws ec2 create-volume \
                --region "$AWS_REGION" --availability-zone "$AWS_AZ" \
                --size 15 --volume-type gp3 --encrypted \
                --tag-specifications "ResourceType=volume,Tags=[{Key=Owner,Value=$GUEST_USERNAME},{Key=Role,Value=desktop-guest-data},{Key=ManagedBy,Value=workflow}]" \
                --query VolumeId --output text)
              echo "created guest volume $VOL_ID for $GUEST_USERNAME"
            else
              echo "reusing existing guest volume $VOL_ID for $GUEST_USERNAME"
            fi
            echo "TF_VAR_user_volume_id=$VOL_ID" >> "$GITHUB_ENV"
          else
            echo "persist=false - no volume, session is fully ephemeral"
            echo "TF_VAR_user_volume_id=" >> "$GITHUB_ENV"
          fi

          # A per-guest password. Never the owner's persistent-stack password -
          # that would hand every guest the same credential the owner uses.
          GUEST_PASSWORD="$(openssl rand -hex 16)"
          echo "TF_VAR_web_password_override=$GUEST_PASSWORD" >> "$GITHUB_ENV"
          echo "::add-mask::$GUEST_PASSWORD"

      - name: terraform apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_web_user: ${{ inputs.username }}
          TF_VAR_fresh: ${{ inputs.fresh }}
          TF_VAR_instance_type: ${{ inputs.instance_type }}
          TF_VAR_username: ${{ inputs.guest_username }}
          TF_VAR_owner_email: ${{ inputs.owner_email }}
          TF_VAR_cloudflare_dns_api_token: ${{ inputs.guest_username != '' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          TF_VAR_enable_access: ${{ inputs.enable_access }}
          TF_VAR_is_guest: ${{ inputs.is_guest }}
          TF_VAR_use_spot: ${{ inputs.use_spot }}
        run: |
          KEY="desktop/terraform.tfstate"
          if [ -n "${{ inputs.guest_username }}" ]; then
            KEY="desktop/user-${{ inputs.guest_username }}/terraform.tfstate"
          fi
          # -lock-timeout instead of failing instantly: the reaper, a manual
          # destroy and this apply can all target one username's state, and
          # "someone else holds the lock for 4 more seconds" should be a wait,
          # not a hard error that leaves the user staring at a failed run.
          terraform -chdir=terraform init -input=false -lock-timeout=180s -backend-config="key=$KEY"
          terraform -chdir=terraform apply -auto-approve -input=false -lock-timeout=180s

      - name: Tell desktop.mnour.dev the guest session is ready
        # The control panel holds no AWS or Terraform credentials - by design,
        # so a compromised panel can never touch infrastructure directly. It
        # cannot read `terraform output` itself, so the guest's URL and
        # password have to be handed to it here, once, right after apply.
        if: inputs.guest_username != ''
        env:
          HUB_CALLBACK_SECRET: ${{ secrets.HUB_CALLBACK_SECRET }}
        run: |
          URL=$(terraform -chdir=terraform output -raw url)
          PASSWORD=$(terraform -chdir=terraform output -raw admin_password)
          INSTANCE_ID=$(terraform -chdir=terraform output -raw instance_id)
          LAUNCHED_AT=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].LaunchTime' --output text | \
            xargs -I{} date -u -d {} +%s)
          if [ -z "$HUB_CALLBACK_SECRET" ]; then
            echo "::error::HUB_CALLBACK_SECRET is not set - the guest has no way to learn their URL or password. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          # owner_email is a FALLBACK only. The hub prefers the email it
          # recorded at dispatch time from a verified Google session, so this
          # value cannot be used to reassign a desktop to someone else. It
          # matters when the hub has no prior state - a hub restart mid-run, or
          # a desktop recovered after a partially-failed apply - where losing
          # the owner leaves a desktop nobody can destroy from the panel.
          PAYLOAD=$(jq -n \
            --arg username "${{ inputs.guest_username }}" \
            --arg url "$URL" \
            --arg password "$PASSWORD" \
            --arg owner_email "${{ inputs.owner_email }}" \
            --arg launched_at "$LAUNCHED_AT" \
            '{username:$username, url:$url, password:$password, owner_email:$owner_email, launched_at:($launched_at|tonumber)}')
          curl -fsS -X POST "https://desktop.mnour.dev/api/session-ready" \
            -H "Authorization: Bearer $HUB_CALLBACK_SECRET" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
          echo "::add-mask::$PASSWORD"

      - name: Where it is, and what it costs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          URL=$(terraform -chdir=terraform output -raw url)
          {
            echo "## Desktop started"
            echo ""
            echo "**$URL** - allow ~80 seconds for the container and TLS to settle."
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Username | \`${{ inputs.username }}\` |"
            echo "| Fresh start | \`${{ inputs.fresh }}\` |"
            echo "| Instance | \`${{ inputs.instance_type }}\` |"
            echo ""
            echo "The password is NOT printed here - job logs are readable by anyone"
            echo "with repo access. Retrieve it with:"
            echo ""
            echo '```'
            echo "terraform -chdir=terraform output -raw admin_password"
            echo '```'
            echo ""
            echo "> This is now billing at roughly \$0.10/hour. Run **Desktop - DESTROY**"
            echo "> when finished; your data survives."
          } >> "$GITHUB_STEP_SUMMARY"
