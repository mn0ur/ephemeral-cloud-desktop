name: Desktop - REAPER

# Per-user desktops have no fixed session length any more - a guest who
# closes the tab and never clicks Destroy would otherwise bill $0.104/hr
# indefinitely. This is what enforces "destroy after 4 hours of not being
# USED" (not "4 hours after launch regardless of use") in practice.
#
# There is no fixed list of usernames to loop over - discovery is by AWS
# tag (Role=guest-desktop), not a hardcoded set. The owner's own desktop
# carries no such tag and is never touched by this workflow.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # manual run, for testing this workflow itself

permissions:
  contents: read

env:
  IDLE_LIMIT_S: 14400 # 4 hours

jobs:
  reap:
    name: destroy anything idle past the limit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7

      - name: Configure AWS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::AWS secrets are not set."
            exit 1
          fi
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=eu-central-1" >> "$GITHUB_ENV"

      - name: Discover every live guest desktop, destroy anything idle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HUB_CALLBACK_SECRET: ${{ secrets.HUB_CALLBACK_SECRET }}
        run: |
          set -uo pipefail
          NOW=$(date -u +%s)

          USERNAMES=$(aws ec2 describe-instances --region eu-central-1 \
            --filters "Name=tag:Role,Values=guest-desktop" "Name=instance-state-name,Values=running,pending" \
            --query 'Reservations[].Instances[].Tags[?Key==`Owner`].Value | [0]' \
            --output text)

          if [ -z "$USERNAMES" ]; then
            echo "no guest desktops currently running"
            exit 0
          fi

          for USERNAME in $USERNAMES; do
            URL="https://$USERNAME.desktop.mnour.dev"
            LAST=$(curl -fsS --max-time 8 "$URL/last-activity" 2>/dev/null || echo "")

            if ! [[ "$LAST" =~ ^[0-9]+$ ]]; then
              # Can't reach it, or it hasn't finished booting yet - do not
              # destroy on the strength of a failed HTTP request. A network
              # blip must never look the same as genuine inactivity.
              echo "$USERNAME: /last-activity unreachable or malformed ('$LAST') - leaving it, not treating as idle"
              continue
            fi

            IDLE_S=$((NOW - LAST))
            if [ "$IDLE_S" -ge "$IDLE_LIMIT_S" ]; then
              echo "$USERNAME: idle ${IDLE_S}s >= ${IDLE_LIMIT_S}s limit - destroying"
              terraform -chdir=terraform init -input=false -reconfigure \
                -backend-config="key=desktop/user-$USERNAME/terraform.tfstate"
              TF_VAR_username="$USERNAME" terraform -chdir=terraform destroy -auto-approve -input=false

              if [ -n "${HUB_CALLBACK_SECRET:-}" ]; then
                curl -fsS -X POST "https://desktop.mnour.dev/api/session-ended" \
                  -H "Authorization: Bearer $HUB_CALLBACK_SECRET" \
                  -H "Content-Type: application/json" \
                  -d "{\"username\":\"$USERNAME\",\"reason\":\"idle\"}" \
                  || echo "::warning::callback failed for $USERNAME - destroy already succeeded"
              fi
            else
              echo "$USERNAME: idle ${IDLE_S}s, under the ${IDLE_LIMIT_S}s limit - leaving it"
            fi
          done
